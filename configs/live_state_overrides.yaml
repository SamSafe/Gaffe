# on the bot's own suggestions rather than live account sync). The public picks
# endpoint supplies squad + bank but NOT free transfers, so FT is recorded here
# from the visible transfer history:
#   GW1 cold start -> 1 FT for GW2; GW2 used 0 -> 2 FT for GW3;
#   GW3 used 1 -> 1 carried + 1 accrued = 2 FT for GW4.
