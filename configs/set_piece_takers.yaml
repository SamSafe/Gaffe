# Manually curated set-piece takers per team per season.
#
# Format:
#   <season_id>:
#     <team_short_name>:
#       penalty: <web_name>          # primary PK taker (single)
#       direct_fk: [<web_name>, ...] # ranked direct-FK takers
#       corner: [<web_name>, ...]    # ranked corner takers
#
# Identifier is FPL web_name (e.g. "M.Salah"). Ambiguous names should add an
# explicit `player_id` field with the FPL `code` (stable across seasons).
#
# Coverage (v1): 2024-25 only, primary takers for the 20 PL teams. Earlier
# seasons need manual backfill before the goals/assists model trains on them.
# Until backfilled, players covered here have penalty/FK/corner flags only
# from the season(s) listed below; older-season rows inherit no flag.
#
# Source: public knowledge / FPL community trackers as of 2024-25 mid-season.
# Primary cross-checks: livefpl.net set-piece notes, FFScout, public match
# reporting. Spot-correctable; flag obvious errors.

