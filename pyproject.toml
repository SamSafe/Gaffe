[project]
name = "fpl-bot"
version = "0.1.0"
description = "Fantasy Premier League optimization bot — probabilistic prediction + stochastic MILP"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "polars>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "selectolax>=0.3",
    "tenacity>=8.3",
]

[project.scripts]
fpl-bot = "fpl_bot.cli.main:app"

[project.optional-dependencies]
ml = [
    "lightgbm>=4.3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
optim = [
    "pyomo>=6.7",
    "highspy>=1.7",
]
dev = [
    "pytest>=8.2",
    "pytest-postgresql>=6.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # en-dashes intentional; matches design doc

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
strict = ["src/fpl_bot/db", "src/fpl_bot/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database",
    "leakage: leakage-detection tests",
]
